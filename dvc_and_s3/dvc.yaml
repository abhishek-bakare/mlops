stages:
  data_ingestion:
    cmd: python src/data_ingestion.py
    deps:     # dependent file
    - src/data_ingestion.py
    outs:
    - /Projects/MLops/dvc_and_s3/data/raw

  data_preprocessing:
    cmd: python src/data_preprocessing.py
    deps:
    - /Projects/MLops/dvc_and_s3/data/raw
    - src/data_preprocessing.py
    outs:
    - /Projects/MLops/dvc_and_s3/dvc_and_s3/data/interim

  feature_engineering:
    cmd: python src/feature_engineering.py
    deps:
    - /Projects/MLops/dvc_and_s3/dvc_and_s3/data/interim
    - src/feature_engineering.py
    params:
    - feature_engineering.max_features
    outs:
    - /Projects/MLops/dvc_and_s3/dvc_and_s3/data/processed

  model_building:
    cmd: python src/model_building.py
    deps:
    - /Projects/MLops/dvc_and_s3/dvc_and_s3/data/interim
    - src/model_building.py
    params:
    - model_building.n_estimators
    - model_building.random_state
    outs:
    - /Projects/MLops/dvc_and_s3/models/model.pkl

  model_evaluation:
    cmd: python src/model_evaluation.py
    deps:
    - /Projects/MLops/dvc_and_s3/models/model.pkl
    - src/model_evaluation.py
    metrics:
    - /Projects/MLops/dvc_and_s3/reports/metrics.json

params:
- dvclive/params.yaml

metrics:
- dvclive/metrics.json

plots:
- dvclive/plots/metrics:
    x: step
